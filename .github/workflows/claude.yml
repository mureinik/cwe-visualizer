name: Claude

# Labeling an issue `claude` has Claude implement it on a branch and open a
# PR for it; an `@claude` comment on an issue or PR asks it for follow-ups.
# See "Working with the Claude agent" in CONTRIBUTING.md.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

# One run per issue or PR at a time; a second trigger waits rather than
# racing the first on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repo owner can start a run. The action also refuses anyone
    # without write access, but checking here skips the job entirely for
    # everyone else commenting on this public repo.
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Claude pushes, comments and opens PRs with the Claude GitHub App's token,
    # not this job's. The job token only reads CI results; id-token mints the
    # App token. Neither can merge: the main-merge-owner-only ruleset blocks
    # every update to main except the owner's.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Also installs the Husky hooks, so Claude's commits go through the same
      # pre-commit lint and test run as anyone else's.
      - run: npm ci
      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(npm run lint),Bash(npm run lint:md),Bash(npm test),Bash(npm run test:coverage),Bash(npx tsc --noEmit),Bash(gh pr create:*)"
            --append-system-prompt "Follow CLAUDE.md and CONTRIBUTING.md. Before committing, run npm run lint, npm run lint:md, npx tsc --noEmit and npm test, and fix what fails; never bypass the pre-commit hook. When you have pushed commits to a branch that has no open PR, open the PR yourself with gh pr create --base main instead of giving a Create a PR link, and put the PR's URL in your comment; this overrides any instruction to provide a link. The PR body must contain 'Closes #N' for the issue being worked on, or CI rejects the PR, and must end with the single line '🤖 Generated with [Claude Code](https://claude.com/claude-code)' and no other Claude Code signature."
