name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run test:coverage
      - run: npm run build

  lint-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
      # Standalone shell scripts; actionlint above covers workflow run: blocks.
      - name: Install shellcheck
        env:
          # Pinned rather than the runner's preinstalled copy, so a runner
          # image update can't change what passes. Bump both together.
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: shellcheck
        # Husky hooks have no .sh extension, so list them explicitly.
        run: git ls-files -z -- '*.sh' .husky/ | xargs -0 -r shellcheck

  # Fails only on findings the PR introduces: Semgrep scans just the files
  # it changed, then the same files on main, and reports the difference.
  # Registry rules aren't versioned, so a rule added upstream never fails a
  # PR for code it didn't touch.
  semgrep:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR's merge commit and its first parent, main's tip, which is
          # the baseline below.
          fetch-depth: 2
      # A step of its own, since the semgrep step's args aren't run through
      # a shell.
      - name: Baseline commit
        id: baseline
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: semgrep
        # Pinned by digest, which fixes Semgrep's dependencies too.
        # Dependabot doesn't update images run here, so bump the version and
        # digest together.
        uses: docker://semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
        with:
          # The image has no entrypoint; its default command is `semgrep --help`.
          entrypoint: semgrep
          args: >-
            scan --metrics=off --error
            --baseline-commit ${{ steps.baseline.outputs.sha }}
            --config p/default --config p/typescript --config p/javascript
            --config p/react --config p/github-actions --config p/secrets

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  validate-issue-link:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read # gh issue view, to check the linked issue is open
    steps:
      - name: Validate PR references an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Dependabot can't link an issue. GitHub doesn't allow brackets in
          # user logins, so no one else can open a PR as this author.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: exempt from the issue-link requirement."
            exit 0
          fi
          ISSUE_NUM=$(printf '%s' "$PR_BODY" | grep -ioE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUE_NUM" ]; then
            echo "::error::PR description must reference an issue via 'Closes #N' (or Fixes/Resolves #N), per this repo's contribution flow (CONTRIBUTING.md)."
            exit 1
          fi
          STATE=$(gh issue view "$ISSUE_NUM" --json state -q .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::Issue #$ISSUE_NUM is not open (state: $STATE) — reference an open issue."
            exit 1
          fi
          echo "PR references open issue #$ISSUE_NUM."

  # Dependabot PRs only, once every other check has passed (validate-issue-link
  # is skipped for them). The reviewer lives in its own file; see it for what
  # it does. A caller's permissions cap the called workflow's, so this is the
  # union of its jobs'; each of those asks only for what it needs.
  dependabot-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [build, lint-workflows, semgrep, dependency-review]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # actionlint 1.7.12 rejects the `$/` self-repository syntax zizmor asks
    # for; drop this suppression once actionlint is bumped to a version that
    # accepts it.
    uses: ./.github/workflows/dependabot-review.yml # zizmor: ignore[self-repository]
    # A Dependabot secret: runs Dependabot triggers can't see Actions secrets.
    # Passed by name rather than `secrets: inherit`, so the reviewer gets only
    # this one.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.DEPENDABOT_CLAUDE_CODE_OAUTH_TOKEN }}
