name: Shellcheck

# Lints the repo's standalone shell scripts, and runs only when one of them
# (or this workflow) changes. Shell in workflow run: blocks is already
# checked by actionlint in ci.yml.
on:
  pull_request:
    paths:
      - '**.sh'
      - '.husky/**'
      - .github/workflows/shellcheck.yml
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '.husky/**'
      - .github/workflows/shellcheck.yml

permissions:
  contents: read

# A new push to a PR supersedes its previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      # Pinned rather than the runner's preinstalled copy, so a runner image
      # update can't change what passes. Bump both together.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          set -euo pipefail
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: shellcheck
        # Husky hooks have no .sh extension, so list them explicitly.
        run: git ls-files -z -- '*.sh' .husky/ | xargs -0 -r shellcheck
