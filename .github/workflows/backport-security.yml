name: Backport security fix

# Backports the security fixes merged into `main` to every release branch
# (vN or vN.M) that npm audit says each advisory affects: one issue and one
# PR per advisory and branch, or only the issue, saying why, when the update
# can't be made.
#
# Why release branches need this: Dependabot opens security updates only
# against the default branch, so nothing else would ever fix them.
#
# What counts as a security fix: any merged PR, by anyone, after which npm
# audit on `main` no longer reports an advisory it reported before. The
# audit diff catches fixes that arrive through a parent package's bump or a
# hand-made change too, which a lookup of the PR's Dependabot alert would
# miss. An advisory against a package `main` no longer uses at all, and a
# retry, need a manual run with the advisory's ID:
#   gh workflow run backport-security.yml -f ghsa=GHSA-xxxx-xxxx-xxxx
#
# Why it uses its own token: PRs and pushes made with the job token don't
# trigger other workflows, so CI would never run on the backport PR. Only
# `open` gets it; the job token elsewhere only reads.
#
# Why each advisory and branch takes two jobs: `backport` runs the release
# branch's code and whatever `npm update` installs (lint, tests, build,
# install scripts), so it never gets BACKPORT_TOKEN. Code that runs there
# could rewrite any file, git config or environment file a later step in
# the same job uses, so keeping the token out of its steps isn't enough. It
# hands `open` only the updated package.json and package-lock.json and a
# result, as an artifact. `open` starts on a fresh runner, treats the
# artifact as untrusted data, runs only `main`'s scripts and git, and does
# everything that writes.
#
# See "Releases" in CONTRIBUTING.md.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ghsa:
        description: GitHub advisory ID to backport, e.g. GHSA-xxxx-xxxx-xxxx
        type: string
        required: true

permissions: {}

jobs:
  # Finds the advisories to backport and the release branches to try them
  # on, and pairs them up.
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # One {ghsa, branch} object per job of `backport` and `open`.
      pairs: ${{ steps.pairs.outputs.pairs || '[]' }}
    steps:
      # The merge commit, with the full history so that the PR's base is
      # there too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          package-manager-cache: false

      # Audits the lockfile before and after the merge, each in a directory
      # of its own; --package-lock-only runs no package code. An advisory
      # that only the first report lists is one the merge fixed. A failed
      # audit on either side fails the job, rather than reading as
      # "nothing fixed".
      #
      # "Before" is the PR's base, not the merge commit's first parent: after
      # a rebase merge, that parent is the PR's own previous commit, and a fix
      # in any earlier commit of the PR would be missed. PRs must be up to
      # date with `main` to merge (strict required checks), so the base is
      # `main` just before the merge, whatever the merge method. Were it ever
      # older, the diff could only grow, and the extra advisories are
      # harmless: each branch's audit and the issue dedupe filter them out.
      - name: Find the advisories the merge fixed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The merge commit is not a commit SHA."
            exit 1
          fi
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The PR's base is not a commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$MERGE_SHA"; then
            echo "::error::The PR's base is not an ancestor of the merge commit."
            exit 1
          fi
          for side in before after; do
            if [ "$side" = before ]; then rev=$BASE_SHA; else rev=$MERGE_SHA; fi
            dir="$RUNNER_TEMP/$side"
            mkdir "$dir"
            git show "$rev:package.json" > "$dir/package.json"
            git show "$rev:package-lock.json" > "$dir/package-lock.json"
            # npm audit exits non-zero when it finds anything, so its status
            # can't tell a finding from a failure. The script can.
            (cd "$dir" && npm audit --json --package-lock-only > "$RUNNER_TEMP/$side.json") || true
            node scripts/advisory-packages.ts --ids < "$RUNNER_TEMP/$side.json" > "$RUNNER_TEMP/$side.ids"
          done
          # Both lists are sorted in code-point order, which LC_ALL=C matches.
          LC_ALL=C comm -23 "$RUNNER_TEMP/before.ids" "$RUNNER_TEMP/after.ids" > "$RUNNER_TEMP/ghsas"
          if [ -s "$RUNNER_TEMP/ghsas" ]; then
            echo "::notice::This merge fixed $(paste -sd ' ' "$RUNNER_TEMP/ghsas")."
          else
            echo "::notice::This merge fixed no advisory that npm audit reports; nothing to backport."
          fi

      - name: Check the advisory
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_GHSA: ${{ inputs.ghsa }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Whole-string match (grep would match line by line). The error
          # doesn't echo the value, which may span lines.
          if ! [[ "$INPUT_GHSA" =~ ^GHSA(-[23456789cfghjmpqrvwx]{4}){3}$ ]]; then
            echo "::error::The advisory ID is not a GHSA ID (GHSA-xxxx-xxxx-xxxx)."
            exit 1
          fi
          # npm audit only knows npm advisories; an ID typed by hand may not be one.
          npm=$(gh api "advisories/$INPUT_GHSA" --jq 'any(.vulnerabilities[]?; .package.ecosystem == "npm")')
          if [ "$npm" != true ]; then
            echo "::error::$INPUT_GHSA is not an advisory against an npm package."
            exit 1
          fi
          echo "$INPUT_GHSA" > "$RUNNER_TEMP/ghsas"

      - name: Pair the advisories with the release branches
        id: pairs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ghsas=()
          while IFS= read -r ghsa; do
            # Again, whole-string: these name jobs, artifacts, issues and branches.
            if ! [[ "$ghsa" =~ ^GHSA(-[23456789cfghjmpqrvwx]{4}){3}$ ]]; then
              echo "::error::An advisory ID is not a GHSA ID (GHSA-xxxx-xxxx-xxxx)."
              exit 1
            fi
            ghsas+=("$ghsa")
          done < "$RUNNER_TEMP/ghsas"
          if [ ${#ghsas[@]} -eq 0 ]; then
            exit 0
          fi
          names=$(gh api --paginate "repos/$GH_REPO/branches" --jq '.[].name')
          releases=()
          while IFS= read -r name; do
            if [[ "$name" =~ ^v[0-9]+(\.[0-9]+)?$ ]]; then
              releases+=("$name")
            fi
          done <<< "$names"
          if [ ${#releases[@]} -eq 0 ]; then
            echo "::notice::There are no release branches to backport to."
          fi
          pairs=$(jq -cn \
            --argjson ghsas "$(jq -cn '$ARGS.positional' --args "${ghsas[@]}")" \
            --argjson branches "$(jq -cn '$ARGS.positional' --args "${releases[@]}")" \
            '[$ghsas[] as $ghsa | $branches[] as $branch | {ghsa: $ghsa, branch: $branch}]')
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"

  # One job per advisory and release branch: audits the branch and, when the
  # advisory affects it and it has no backport issue yet, tries the update
  # and CI's checks. The result goes to `open` as the artifact
  # backport-<branch>-<ghsa> (both were validated, so they make a valid
  # artifact name). No artifact means there is nothing to report. A red job means the audit or the re-audit
  # failed, which never counts as "not affected" or as a failed update: it
  # uploads nothing, so no issue is opened.
  backport:
    needs: resolve
    if: needs.resolve.outputs.pairs != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read # issue-by-title.sh, for the dedupe check
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.pairs) }}
    # A rerun, or a manual run after the automatic one, waits for the first.
    concurrency:
      group: backport-${{ matrix.ghsa }}-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      GHSA: ${{ matrix.ghsa }}
      BRANCH: ${{ matrix.branch }}
    steps:
      # `main`'s scripts, as release-publish.yml does: a release branch's
      # copies, if it has any, are as old as the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tools
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ matrix.branch }}
          path: release
          persist-credentials: false

      # No npm cache: this job saves ~/.npm after untrusted code ran, and
      # release-publish.yml restores the same cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit the branch
        id: audit
        working-directory: release
        run: |
          set -euo pipefail
          # npm audit exits non-zero when it finds anything, so its status
          # can't tell a finding from a failure. The script can: it exits
          # non-zero on a report that is an error or isn't a report.
          npm audit --json --package-lock-only > "$RUNNER_TEMP/audit.json" || true
          found=$(node ../tools/scripts/advisory-packages.ts "$GHSA" < "$RUNNER_TEMP/audit.json")
          packages=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            # npm update gets these unquoted, so allow only plain names.
            if ! [[ "$name" =~ ^(@[a-z0-9._~-]+/)?[a-z0-9._~-]+$ ]]; then
              echo "::error::npm audit named a package that isn't a plain npm package name."
              exit 1
            fi
            packages+=("$name")
          done <<< "$found"
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::notice::$GHSA doesn't affect $BRANCH."
          fi
          echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

      # Saves the work of updating a branch whose backport is already
      # reported. `open` checks again before it writes.
      - name: Check for an earlier backport
        id: dedupe
        if: steps.audit.outputs.packages != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(tools/.github/scripts/issue-by-title.sh "Backport $GHSA to $BRANCH")
          if [ -n "$existing" ]; then
            echo "::notice::$GHSA is already handled on $BRANCH: $existing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The update and the checks may fail; the result step records which,
      # and `open` turns that into an issue.
      - name: Update the packages
        id: update
        if: steps.dedupe.outputs.proceed == 'true'
        continue-on-error: true
        working-directory: release
        env:
          PACKAGES: ${{ steps.audit.outputs.packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per package; the audit step allowed only plain names
          npm update -- $PACKAGES

      # The update stays within package.json's ranges, so the advisory may
      # survive it, which is a failed update. A failed re-audit is not: like
      # the first audit, it fails the job, and nothing is reported.
      - name: Audit the update
        id: reaudit
        if: steps.update.outcome == 'success'
        working-directory: release
        run: |
          set -euo pipefail
          npm audit --json --package-lock-only > "$RUNNER_TEMP/reaudit.json" || true
          remaining=$(node ../tools/scripts/advisory-packages.ts "$GHSA" < "$RUNNER_TEMP/reaudit.json")
          if [ -n "$remaining" ]; then
            echo "::warning::npm audit still reports $GHSA after the update."
            echo "still_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "still_affected=false" >> "$GITHUB_OUTPUT"
          fi

      # The same commands as ci.yml's build job, coverage thresholds included.
      - name: Run CI's checks
        id: checks
        if: steps.reaudit.outputs.still_affected == 'false'
        continue-on-error: true
        working-directory: release
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run lint:md
          npm run lint:css
          npm run test:coverage
          npm run build

      # Runs only when every step so far succeeded or was allowed to fail,
      # so never after a failed audit or re-audit.
      - name: Record the result
        id: result
        if: steps.dedupe.outputs.proceed == 'true'
        env:
          PACKAGES: ${{ steps.audit.outputs.packages }}
          UPDATE: ${{ steps.update.outcome }}
          STILL_AFFECTED: ${{ steps.reaudit.outputs.still_affected }}
          CHECKS: ${{ steps.checks.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/result"
          mkdir "$out"
          if [ "$UPDATE" != success ] || [ "$STILL_AFFECTED" != false ]; then
            outcome=update-failed
          elif [ "$CHECKS" != success ]; then
            outcome=checks-failed
          else
            outcome=ok
            cp release/package.json release/package-lock.json "$out/"
          fi
          echo "$outcome" > "$out/outcome"
          tr ' ' '\n' <<< "$PACKAGES" > "$out/packages"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.result.outcome == 'success'
        with:
          name: backport-${{ matrix.branch }}-${{ matrix.ghsa }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 7

  # Reports each advisory and branch's result: pushes the backport and opens its issue and
  # PR, or opens only the issue, saying what failed. A fresh runner that never
  # runs npm or any of the release branch's code, so it can hold
  # BACKPORT_TOKEN. Opening the issue is the designed outcome of a failed
  # update, so the job stays green once it's open; the issue, not the run,
  # says so.
  open:
    needs: [resolve, backport]
    # Runs after a failed backport job too, since its other pairs may
    # have results; skipped on cancellation, which says nothing about them.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.pairs != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.pairs) }}
    # Not backport's group: a group holds one pending job, so a run's `open`
    # could cancel, or be cancelled by, another run's pending `backport`.
    # This one serializes the dedupe check below with the writes.
    concurrency:
      group: backport-open-${{ matrix.ghsa }}-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      GHSA: ${{ matrix.ghsa }}
      BRANCH: ${{ matrix.branch }}
    steps:
      # A pattern rather than a name: no match downloads nothing and
      # succeeds, while a name that matches nothing fails like an error.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backport-${{ matrix.branch }}-${{ matrix.ghsa }}
          merge-multiple: true
          path: ${{ runner.temp }}/result

      # The artifact was written next to the release branch's code, so
      # nothing in it is used before it's checked here.
      - name: Read the result
        id: result
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/result"
          if [ ! -e "$in/outcome" ]; then
            echo "::notice::Nothing to report for $GHSA on $BRANCH: it isn't affected, already has its issue, or its backport job failed."
            echo "report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outcome=$(cat "$in/outcome")
          case "$outcome" in
            ok)
              if [ ! -f "$in/package.json" ] || [ ! -f "$in/package-lock.json" ]; then
                echo "::error::The backport result has no package files."
                exit 1
              fi
              ;;
            update-failed | checks-failed) ;;
            *)
              echo "::error::The backport result has an unknown outcome."
              exit 1
              ;;
          esac
          packages=()
          while IFS= read -r name; do
            if ! [[ "$name" =~ ^(@[a-z0-9._~-]+/)?[a-z0-9._~-]+$ ]]; then
              echo "::error::The backport result names a package that isn't a plain npm package name."
              exit 1
            fi
            packages+=("$name")
          done < "$in/packages"
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::The backport result names no packages."
            exit 1
          fi
          {
            echo "outcome=$outcome"
            echo "packages=${packages[*]}"
            echo "report=true"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.result.outputs.report == 'true'
        with:
          ref: main
          path: tools
          persist-credentials: false

      # Again, now that this job holds the only lock that writes: another run
      # may have reported the branch since this run's backport job checked.
      - name: Check for an earlier backport
        id: dedupe
        if: steps.result.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(tools/.github/scripts/issue-by-title.sh "Backport $GHSA to $BRANCH")
          if [ -n "$existing" ]; then
            echo "::notice::$GHSA is already handled on $BRANCH: $existing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.dedupe.outputs.proceed == 'true' && steps.result.outputs.outcome == 'ok'
        with:
          ref: refs/heads/${{ matrix.branch }}
          path: release
          persist-credentials: false

      - name: Push the backport branch
        id: push
        if: steps.dedupe.outputs.proceed == 'true' && steps.result.outputs.outcome == 'ok'
        continue-on-error: true
        working-directory: release
        env:
          BACKPORT_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
        run: |
          set -euo pipefail
          # The credential helper of release-publish.yml, with BACKPORT_TOKEN,
          # so the push triggers CI on the PR.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="credential.https://github.com.helper"
          # shellcheck disable=SC2016 # the helper's shell expands the token, not this one
          export GIT_CONFIG_VALUE_0='!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=${BACKPORT_TOKEN}"; }; f'
          # Nothing ran npm here, so Husky installed no hooks; this keeps
          # git from running any hook at all. The backport job already ran
          # the checks the pre-commit hook would.
          export GIT_CONFIG_KEY_1="core.hooksPath"
          export GIT_CONFIG_VALUE_1=/dev/null
          head="backport/$BRANCH/$GHSA"
          git switch -c "$head"
          # Only these two files are taken from the artifact, and they go
          # into a PR, which CI checks and the owner reviews.
          cp "$RUNNER_TEMP/result/package.json" "$RUNNER_TEMP/result/package-lock.json" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): backport $GHSA to $BRANCH"
          git push origin "HEAD:refs/heads/$head"

      - name: Report
        if: steps.dedupe.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.result.outputs.outcome }}
          PACKAGES: ${{ steps.result.outputs.packages }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          failure=()
          if [ "$OUTCOME" = update-failed ]; then
            failure=("No patched version fits $BRANCH's dependency ranges, or npm update failed.")
          elif [ "$OUTCOME" = checks-failed ]; then
            failure=("npm update succeeded, but CI's checks failed on the result.")
          elif [ "$PUSH" != success ]; then
            failure=("Could not push backport/$BRANCH/$GHSA; it may exist from an earlier run.")
          fi
          tools/.github/scripts/open-backport.sh "$GHSA" "$BRANCH" "$PACKAGES" "${failure[@]}"
