# Updates are grouped by what they belong to, not by semver level: each group
# gets one PR covering its major, minor and patch bumps alike, so packages
# that move together are reviewed together. Any npm package outside the
# groups gets a PR of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    # Ungrouped packages each get a PR, so allow more than the default 5.
    open-pull-requests-limit: 10
    # @types/node is pinned to the minimum Node in package.json's engines, so
    # the types never offer APIs that Node lacks. Bump it by hand, together
    # with engines, when the minimum Node version changes.
    ignore:
      - dependency-name: '@types/node'
      # TypeScript 7 dropped the JavaScript compiler API that typescript-eslint's
      # type-aware rules need, and no typescript-eslint release supports it yet.
      # Stay on 6.x until one does:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    # Wildcards pick up new packages in a category without editing this list.
    groups:
      lint:
        patterns:
          - '*lint*'
          - globals
          - husky
      vite:
        patterns:
          - '*vite*'
        # A Vite plugin for a linter (say, vite-plugin-eslint) belongs in lint.
        exclude-patterns:
          - '*lint*'
      react:
        patterns:
          - '*react*'
          - '@testing-library/*'
        # *react* also matches eslint-plugin-react-* and @vitejs/plugin-react.
        # Group order doesn't decide where such overlaps go (Dependabot put
        # them in react), so exclude them here to keep them in lint and vite.
        exclude-patterns:
          - '*lint*'
          - '*vite*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    groups:
      ci:
        patterns: ['*']
