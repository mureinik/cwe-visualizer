# Updates are grouped by what they belong to, not by semver level: each group
# gets one PR covering its major, minor and patch bumps alike, so packages
# that move together are reviewed together. Any npm package outside the
# groups gets a PR of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    # Ungrouped packages each get a PR, so allow more than the default 5.
    open-pull-requests-limit: 10
    # Wildcards pick up new packages in a category without editing this list.
    # A package matching several groups joins the first one, so the order
    # matters: eslint-plugin-react-* goes to lint and @vitejs/plugin-react to
    # vite, not react.
    groups:
      lint:
        patterns:
          - '*lint*'
          - globals
          - husky
      vite:
        patterns:
          - '*vite*'
      react:
        patterns:
          - '*react*'
          - '@testing-library/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    groups:
      ci:
        patterns: ['*']
