# Groups only bundle updates, they don't filter them: minor and patch bumps
# arrive as one PR per ecosystem, and each major bump as its own PR, so a
# breaking upgrade gets its own CI run and review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
